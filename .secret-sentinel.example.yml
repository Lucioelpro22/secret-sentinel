# HISTORICAL DESIGN ONLY: YAML loading is unsupported. Use .secret-sentinel.example.json with --policy.
version: 1
scan:
  # Keep scope explicit; do not scan mounted credentials or unrelated paths.
  include:
    - .
  exclude:
    - .git/
    - .venv/
    - node_modules/
    - dist/
  max_file_size_bytes: 1048576
policy:
  fail_on: high
  minimum_confidence: 0.85
  # Detector IDs are reviewed by the maintainers; do not disable findings casually.
  disabled_detectors: []
output:
  redact: true
  formats:
    - json
    - markdown
