[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-sentinel"
version = "0.2.0"
description = "Offline, read-only secret detection with redacted findings"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
secret-sentinel = "secret_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["secret_sentinel"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
