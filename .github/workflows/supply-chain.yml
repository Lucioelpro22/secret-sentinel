name: Supply-chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pip-audit twine
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Audit built environment
        run: python -m pip_audit --strict --desc
      - name: Record artifact hashes and dependency inventory
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          python -m pip inspect --local > dist/pip-inspect.json
      - name: Upload package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-sentinel-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
